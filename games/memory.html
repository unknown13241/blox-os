<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Memory Flip</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 16px;
    background: #070912; color: #f2f3ff; font-family: "Segoe UI", sans-serif;
    user-select: none;
  }
  h1 { margin: 0; font-size: 24px; }
  h1 span { color: #ff4ecd; }
  .hud { display: flex; gap: 24px; color: #9a9db8; font-size: 14px; }
  .hud b { color: #fff; font-size: 18px; }
  .board {
    display: grid; grid-template-columns: repeat(4, 78px); gap: 12px;
    padding: 20px; border-radius: 16px;
    background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1);
  }
  .card {
    width: 78px; height: 78px; border-radius: 12px; cursor: pointer;
    display: grid; place-items: center; font-size: 36px;
    background: linear-gradient(135deg, #7c5cff, #ff4ecd);
    box-shadow: 0 6px 18px rgba(0,0,0,0.4);
    transition: transform 0.25s ease, background 0.25s ease;
    transform-style: preserve-3d;
  }
  .card:hover { transform: translateY(-3px); }
  .card.flipped, .card.matched { background: #151a33; box-shadow: none; }
  .card.matched { opacity: 0.45; cursor: default; }
  .card .face { transform: rotateY(180deg); opacity: 0; transition: 0.2s; }
  .card.flipped .face, .card.matched .face { transform: none; opacity: 1; }
  button {
    border: 0; cursor: pointer; font-family: inherit; font-weight: 700;
    padding: 11px 22px; border-radius: 10px; font-size: 15px; color: #fff;
    background: linear-gradient(135deg, #ff4ecd, #a06bff);
  }
  .win { position: fixed; inset: 0; display: none; flex-direction: column;
    align-items: center; justify-content: center; gap: 16px;
    background: rgba(7,9,18,0.85); backdrop-filter: blur(6px); font-size: 22px; }
  .win.show { display: flex; }
</style>
</head>
<body>
  <h1>MEMORY <span>FLIP</span></h1>
  <div class="hud"><div>Moves <b id="moves">0</b></div><div>Matches <b id="matches">0</b>/8</div></div>
  <div class="board" id="board"></div>
  <button id="restart">↻ New game</button>
  <div class="win" id="win"><div>🎉 You win!</div><div id="winMsg" style="font-size:15px;color:#9a9db8"></div><button id="playAgain">Play again</button></div>

<script>
(function () {
  const ICONS = ['🐶','🍕','🚀','🌈','🎧','⚽','🔥','🍩'];
  const board = document.getElementById('board');
  const movesEl = document.getElementById('moves');
  const matchesEl = document.getElementById('matches');
  const win = document.getElementById('win');
  let deck = [], first = null, lock = false, moves = 0, matches = 0;

  function shuffle(a) {
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function init() {
    deck = shuffle([...ICONS, ...ICONS]);
    board.innerHTML = '';
    first = null; lock = false; moves = 0; matches = 0;
    movesEl.textContent = '0';
    matchesEl.textContent = '0';
    win.classList.remove('show');

    deck.forEach((icon, index) => {
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.index = index;
      card.dataset.icon = icon;
      card.innerHTML = '<span class="face">' + icon + '</span>';
      card.addEventListener('click', () => flip(card));
      board.appendChild(card);
    });
  }

  function flip(card) {
    if (lock || card.classList.contains('flipped') || card.classList.contains('matched')) return;
    card.classList.add('flipped');

    if (!first) { first = card; return; }

    moves++;
    movesEl.textContent = moves;

    if (first.dataset.icon === card.dataset.icon) {
      first.classList.add('matched');
      card.classList.add('matched');
      first = null;
      matches++;
      matchesEl.textContent = matches;
      if (matches === ICONS.length) {
        document.getElementById('winMsg').textContent = 'Completed in ' + moves + ' moves.';
        win.classList.add('show');
      }
    } else {
      lock = true;
      const a = first, b = card;
      setTimeout(() => {
        a.classList.remove('flipped');
        b.classList.remove('flipped');
        first = null;
        lock = false;
      }, 800);
    }
  }

  document.getElementById('restart').addEventListener('click', init);
  document.getElementById('playAgain').addEventListener('click', init);
  init();
})();
</script>
</body>
</html>
