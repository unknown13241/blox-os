<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Neon Snake</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px;
    background: #070912; color: #f2f3ff; font-family: "Segoe UI", sans-serif;
    user-select: none;
  }
  h1 { margin: 0; font-size: 24px; letter-spacing: 1px; }
  h1 span { color: #00d4ff; }
  .hud { display: flex; gap: 24px; font-size: 14px; color: #9a9db8; }
  .hud b { color: #fff; font-size: 18px; }
  .wrap { position: relative; }
  canvas {
    background: #0e1226; border: 1px solid rgba(124,92,255,0.5);
    border-radius: 12px; box-shadow: 0 0 40px rgba(124,92,255,0.25);
    display: block;
  }
  .overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px;
    background: rgba(7,9,18,0.82); border-radius: 12px; backdrop-filter: blur(4px);
  }
  .overlay.hidden { display: none; }
  .overlay h2 { margin: 0; font-size: 30px; }
  button {
    border: 0; cursor: pointer; font-family: inherit; font-weight: 700;
    padding: 11px 22px; border-radius: 10px; font-size: 15px; color: #fff;
    background: linear-gradient(135deg, #7c5cff, #a06bff);
  }
  .pad { display: grid; grid-template-columns: repeat(3, 46px); grid-template-rows: repeat(2, 46px); gap: 6px; }
  .pad button {
    padding: 0; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12);
    font-size: 18px; border-radius: 10px;
  }
  .pad button:active { background: rgba(124,92,255,0.5); }
  .pad .up { grid-column: 2; }
  .pad .left { grid-column: 1; grid-row: 2; }
  .pad .down { grid-column: 2; grid-row: 2; }
  .pad .right { grid-column: 3; grid-row: 2; }
  .hint { font-size: 12px; color: #6d7191; }
</style>
</head>
<body>
  <h1>NEON <span>SNAKE</span></h1>
  <div class="hud"><div>Score <b id="score">0</b></div><div>Best <b id="best">0</b></div></div>
  <div class="wrap">
    <canvas id="game" width="400" height="400"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="overlayTitle">Ready?</h2>
      <p class="hint">Use arrow keys, WASD, or the buttons below.</p>
      <button id="startBtn">Start game</button>
    </div>
  </div>
  <div class="pad">
    <button class="up" data-dir="up">↑</button>
    <button class="left" data-dir="left">←</button>
    <button class="down" data-dir="down">↓</button>
    <button class="right" data-dir="right">→</button>
  </div>

<script>
(function () {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlayTitle');
  const startBtn = document.getElementById('startBtn');

  const CELL = 20;
  const COLS = canvas.width / CELL;
  const ROWS = canvas.height / CELL;
  let snake, dir, nextDir, food, score, running, timer;
  let best = Number(localStorage.getItem('snakeBest') || 0);
  bestEl.textContent = best;

  function reset() {
    snake = [{ x: 8, y: 10 }, { x: 7, y: 10 }, { x: 6, y: 10 }];
    dir = { x: 1, y: 0 };
    nextDir = dir;
    score = 0;
    scoreEl.textContent = 0;
    placeFood();
  }

  function placeFood() {
    do {
      food = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
    } while (snake.some((s) => s.x === food.x && s.y === food.y));
  }

  function start() {
    reset();
    running = true;
    overlay.classList.add('hidden');
    clearInterval(timer);
    timer = setInterval(step, 110);
    draw();
  }

  function step() {
    dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS ||
        snake.some((s) => s.x === head.x && s.y === head.y)) {
      return gameOver();
    }

    snake.unshift(head);
    if (head.x === food.x && head.y === food.y) {
      score += 10;
      scoreEl.textContent = score;
      if (score > best) { best = score; bestEl.textContent = best; localStorage.setItem('snakeBest', best); }
      placeFood();
    } else {
      snake.pop();
    }
    draw();
  }

  function draw() {
    ctx.fillStyle = '#0e1226';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // grid glow
    ctx.strokeStyle = 'rgba(124,92,255,0.07)';
    for (let i = 0; i <= COLS; i++) {
      ctx.beginPath(); ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, canvas.height); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, i * CELL); ctx.lineTo(canvas.width, i * CELL); ctx.stroke();
    }

    ctx.fillStyle = '#ff4ecd';
    ctx.shadowColor = '#ff4ecd'; ctx.shadowBlur = 14;
    ctx.fillRect(food.x * CELL + 3, food.y * CELL + 3, CELL - 6, CELL - 6);

    ctx.shadowColor = '#00d4ff';
    snake.forEach((s, i) => {
      ctx.fillStyle = i === 0 ? '#00d4ff' : `rgba(124,92,255,${Math.max(0.35, 1 - i / (snake.length + 4))})`;
      ctx.shadowBlur = i === 0 ? 16 : 6;
      ctx.fillRect(s.x * CELL + 2, s.y * CELL + 2, CELL - 4, CELL - 4);
    });
    ctx.shadowBlur = 0;
  }

  function gameOver() {
    running = false;
    clearInterval(timer);
    overlayTitle.textContent = 'Game over';
    startBtn.textContent = 'Play again';
    overlay.classList.remove('hidden');
  }

  function setDir(x, y) {
    if (dir.x === -x && dir.y === -y) return;
    nextDir = { x, y };
  }

  document.addEventListener('keydown', (e) => {
    const map = {
      ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0],
      w: [0, -1], s: [0, 1], a: [-1, 0], d: [1, 0],
    };
    const key = e.key.length === 1 ? e.key.toLowerCase() : e.key;
    if (map[key]) { e.preventDefault(); setDir(map[key][0], map[key][1]); }
    if (e.key === ' ' && !running) start();
  });

  document.querySelectorAll('[data-dir]').forEach((btn) => {
    btn.addEventListener('click', () => {
      const dirs = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
      setDir(...dirs[btn.dataset.dir]);
      if (!running) start();
    });
  });

  startBtn.addEventListener('click', start);
  reset();
  draw();
})();
</script>
</body>
</html>
